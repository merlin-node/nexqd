name: nexqd

services:
  nexqd:
    image: ghcr.io/merlin-node/nexqd:latest
    build: .
    container_name: nexqd
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
